name: Check upstream sources
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Observe current upstream sources
        run: npm run sources:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
      - name: Publish check summary
        if: always()
        shell: bash
        run: |
          if [ -f .cache/upstream-check/report.md ]; then
            cat .cache/upstream-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upstream-source-check
          path: .cache/upstream-check/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
