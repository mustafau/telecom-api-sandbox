        - onHold
        - validated
        - sent
        - settled
        - partiallyPaid
      type: string
      description: >-
        Recommended Enumeration Type (not formal forced in standard): Valid values for the lifecycle
        state of the bill: new = 'bill is ready to validate or to sent', validated = 'bill is
