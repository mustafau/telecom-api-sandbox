    Customer360ServiceProblemVO:
      description: >-
        ServiceProblem value object to contain the important information about the service problems
        of a customer.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            affectedService:
              type: array
              description: >-
                List of affected services. At least one of affectedResource, affectedService or
                affectedLocation should be present.
              items:
                $ref: '#/components/schemas/ServiceRef'
            category:
              type: string
              description: >-
                Classifier for the problem. Settable. For example, this is used for distinguish the
                category of problem originator in [role].[category] format. Example:
                serviceProvider.declarer, supplier.originated, system.originated
            description:
              type: string
              description: Free form text describing the Service Problem
            originatingSystem:
              type: string
              description: Indicates where the problem was generated
            priority:
              type: integer
              description: >-
                An indication varying from 1 (highest) to 10 (lowest) of how important it is for the
                service provider to correct the Service Problem.
            reason:
              type: string
              description: >-
                Reason, if known, for the service problem that will assist the Service Provider in
                understanding the underlying cause or contributing factors, enabling more accurate
                diagnosis and resolution. This can be set to Unknown, otherwise.
            status:
              type: string
              description: >-
                The current status of the service problem. Possible values are Submitted, Rejected,
                Acknowledged, In Progress [Held, Pending], Resolved, Closed, and Cancelled.
      discriminator:
        propertyName: '@type'
        mapping:
          Customer360ServiceProblemVO: '#/components/schemas/Customer360ServiceProblemVO'
