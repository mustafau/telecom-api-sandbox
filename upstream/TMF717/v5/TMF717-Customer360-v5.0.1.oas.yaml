openapi: 3.0.1
info:
  title: Customer360
  description: |-
    **TMF API Reference : TMF - 717 Customer 360.**
     An API to give a consolidated Customer overview. This is a view-only API, based on the various underlying involved TM Forum Open APIs. This API provides references where one can find detailed information for:
    Account
    Agreement
    Appointment
    Customer
    CustomerBill
    LoyaltyAccount
    PartyInteraction
    PaymentMethod
    Product
    ProductOrder
    Quote
    ServiceProblem
    TroubleTicket
  version: 5.0.1
  x-generation-tooling-version: v8.6.16
  x-generation-data-model-version: unknown
  x-generation-date: '2026-09-11T10:23:57.892Z'
  x-api-id: TMF717
  license:
    name: Apache License 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
