components:
  schemas:
    AccountBalance:
      description: Balances linked to the account
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            id:
              type: string
              description: Identifier of the balance within list of the balances (for entities with list)
            amount:
              $ref: '#/components/schemas/Money'
            balanceType:
              type: string
              description: >-
                Type of the balance : deposit balance, disputed balance, loyalty balance, receivable
                balance...
            validFor:
              $ref: '#/components/schemas/TimePeriod'
          required:
            - amount
            - balanceType
            - validFor
      discriminator:
        propertyName: '@type'
        mapping:
          AccountBalance: '#/components/schemas/AccountBalance'
    AccountBalance_EVO:
      description: Balances linked to the account
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            id:
              type: string
              description: Identifier of the balance within list of the balances (for entities with list)
            amount:
              $ref: '#/components/schemas/Money_EVO'
            balanceType:
              type: string
              description: >-
                Type of the balance : deposit balance, disputed balance, loyalty balance, receivable
                balance...
            validFor:
              $ref: '#/components/schemas/TimePeriod_EVO'
      discriminator:
        propertyName: '@type'
        mapping:
          AccountBalance: '#/components/schemas/AccountBalance_EVO'
    AccountRef:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AccountRef: '#/components/schemas/AccountRef'
    AccountRef_EVO:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AccountRef: '#/components/schemas/AccountRef_EVO'
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    AgreementItemRef:
      description: It's a Agreement item that has been executed previously.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            agreementName:
              type: string
              description: Name of the related entity.
            agreementHref:
              type: string
              description: Reference of the related entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
            agreementId:
              type: string
              description: Unique identifier of a related entity.
            agreementItemId:
              type: string
              description: Id of an item of a Agreement
          required:
            - agreementId
            - agreementItemId
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementItemRef: '#/components/schemas/AgreementItemRef'
    AgreementItemRef_EVO:
      description: It's a Agreement item that has been executed previously.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            agreementName:
              type: string
              description: Name of the related entity.
            agreementHref:
              type: string
              description: Reference of the related entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
            agreementId:
              type: string
              description: Unique identifier of a related entity.
            agreementItemId:
              type: string
              description: Id of an item of a Agreement
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementItemRef: '#/components/schemas/AgreementItemRef_EVO'
    AgreementRef:
      type: object
      description: >-
        Agreement reference. An agreement represents a contract or arrangement, either written or
        verbal and sometimes enforceable by law, such as a service level agreement or a customer
        price agreement. An agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementRef: '#/components/schemas/AgreementRef'
    AgreementRef_EVO:
      type: object
      description: >-
        Agreement reference. An agreement represents a contract or arrangement, either written or
        verbal and sometimes enforceable by law, such as a service level agreement or a customer
        price agreement. An agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementRef: '#/components/schemas/AgreementRef_EVO'
    AgreementSpecificationRef:
      description: >-
        Agreement specification reference. An AgreementSpecification represents a template of an
        agreement that can be used when establishing partnerships.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              description: A narrative that explains in detail what the agreement specification is about.
            version:
              type: string
              description: Agreement specification version
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementSpecificationRef: '#/components/schemas/AgreementSpecificationRef'
    AgreementSpecificationRef_EVO:
      description: >-
        Agreement specification reference. An AgreementSpecification represents a template of an
        agreement that can be used when establishing partnerships.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              description: A narrative that explains in detail what the agreement specification is about.
            version:
              type: string
              description: Agreement specification version
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementSpecificationRef: '#/components/schemas/AgreementSpecificationRef_EVO'
    AppointmentRef:
      description: 'Refers an appointment, such as a Customer presentation or internal meeting or site visit'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              description: An explanatory text regarding the appointment made with a party
      discriminator:
        propertyName: '@type'
        mapping:
          AppointmentRef: '#/components/schemas/AppointmentRef'
    AppointmentRef_EVO:
      description: 'Refers an appointment, such as a Customer presentation or internal meeting or site visit'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              description: An explanatory text regarding the appointment made with a party
      discriminator:
        propertyName: '@type'
        mapping:
          AppointmentRef: '#/components/schemas/AppointmentRef_EVO'
    AppointmentStateType:
      enum:
        - confirmed
        - cancelled
        - pending
        - rescheduled
        - inProgress
        - completed
        - expired
        - failed
      type: string
      description: Valid values for the lifecycle state of the appointment
    Attachment:
      description: >-
        Complements the description of an element (for instance a product) through video,
        pictures...
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: >-
                The URL pointing to the attachment content held in an external system, such as a
                content management system or document repository. Mutually exclusive with content.
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: >-
                The actual contents of the attachment object, embedded inline and encoded as base64.
                Mutually exclusive with url.
            size:
              $ref: '#/components/schemas/Quantity'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: >-
                A technical characterization of the attachment content format using an IETF Media
                Type, for example application/pdf or image/png. Note: this property is named
                mimeType for historical reasons.
          required:
            - attachmentType
            - mimeType
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
    Attachment_EVO:
      description: >-
        Complements the description of an element (for instance a product) through video,
        pictures...
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: >-
                The URL pointing to the attachment content held in an external system, such as a
                content management system or document repository. Mutually exclusive with content.
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: >-
                The actual contents of the attachment object, embedded inline and encoded as base64.
                Mutually exclusive with url.
            size:
              $ref: '#/components/schemas/Quantity_EVO'
            validFor:
              $ref: '#/components/schemas/TimePeriod_EVO'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: >-
                A technical characterization of the attachment content format using an IETF Media
                Type, for example application/pdf or image/png. Note: this property is named
                mimeType for historical reasons.
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment_EVO'
    AttachmentRef:
      description: >-
        Attachment reference. An attachment complements the description of an element (for instance
        a product) through video, pictures
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              deprecated: true
              description: >-
                A narrative text describing the content of the attachment. DEPRECATED: will be
                removed in v6.
            url:
              deprecated: true
              description: 'Link to the attachment media/content. DEPRECATED: will be removed in v6.'
              type: string
          required:
            - '@referredType'
      discriminator:
        propertyName: '@type'
        mapping:
          AttachmentRef: '#/components/schemas/AttachmentRef'
    AttachmentRef_EVO:
      description: >-
        Attachment reference. An attachment complements the description of an element (for instance
        a product) through video, pictures
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            description:
              type: string
              deprecated: true
              description: >-
                A narrative text describing the content of the attachment. DEPRECATED: will be
                removed in v6.
            url:
              deprecated: true
              description: 'Link to the attachment media/content. DEPRECATED: will be removed in v6.'
              type: string
      discriminator:
        propertyName: '@type'
        mapping:
          AttachmentRef: '#/components/schemas/AttachmentRef_EVO'
    AttachmentRefOrValue:
      type: object
      description: >-
        The polymorphic attributes @type, @schemaLocation & @referredType are related to the
        Attachment entity and not the AttachmentRefOrValue class itself
      oneOf:
        - $ref: '#/components/schemas/Attachment'
        - $ref: '#/components/schemas/AttachmentRef'
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
          AttachmentRef: '#/components/schemas/AttachmentRef'
    AttachmentRefOrValue_EVO:
      type: object
      description: >-
        The polymorphic attributes @type, @schemaLocation & @referredType are related to the
        Attachment entity and not the AttachmentRefOrValue class itself
      oneOf:
