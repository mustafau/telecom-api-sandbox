        - $ref: '#/components/schemas/AttachmentRef_EVO'
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment_EVO'
          AttachmentRef: '#/components/schemas/AttachmentRef_EVO'
    bbox:
      items:
        type: number
      minItems: 4
      type: array
      description: >-
        A bounding box array that contains the geometry. The axes order follows the axes order of
        the geometry
    bbox_EVO:
      items:
        type: number
      minItems: 4
      type: array
      description: >-
        A bounding box array that contains the geometry. The axes order follows the axes order of
        the geometry
    BillingAccountRef:
      description: BillingAccount reference. A BillingAccount is a detailed description of a bill structure.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          properties:
            ratingType:
              type: string
              description: >-
                Indicates whether the account follows a specific payment option such as prepaid or
                postpaid
      discriminator:
        propertyName: '@type'
        mapping:
          BillingAccountRef: '#/components/schemas/BillingAccountRef'
    BillingAccountRef_EVO:
      description: BillingAccount reference. A BillingAccount is a detailed description of a bill structure.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/EntityRef'
        - type: object
