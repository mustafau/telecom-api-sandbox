    BusinessPartner_EVO:
      type: object
      description: 'When business partner is the BusinessPartner '
      allOf:
        - $ref: '#/components/schemas/PartyRole_EVO'
    CalendarEventRef:
      type: object
      description: Reference of a CalendarEvent
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          CalendarEventRef: '#/components/schemas/CalendarEventRef'
    CalendarEventRef_EVO:
      type: object
      description: Reference of a CalendarEvent
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          CalendarEventRef: '#/components/schemas/CalendarEventRef_EVO'
    CalendarPeriod:
      description: >-
        The CalendarPeriod schema represents a period of time within a calendar, defining various
        attributes such as the applicable day, timezone, hour period, and status. It is designed to
        capture information about the availability or status of a calendar period, which can be used
        in scheduling, booking, or resource allocation applications.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            day:
              $ref: '#/components/schemas/DayOfWeekType'
            timeZone:
              type: string
              pattern: '^(Z|[+-][0-1]\d:[0-5]\d)$'
              description: >-
                Indication of the timezone applicable to the calendar information in ISO 8601
                timezone: either 'Z' for UTC or an offset like +02:00 or -05:30.
            hourPeriod:
              type: array
              description: 'Start and end time range in 24-hour HH:mm format.'
              items:
                $ref: '#/components/schemas/HourPeriod'
            status:
              type: string
              description: >-
                Indication of the availability of the calendar period (e.g.: available, booked,
                etc.)
          required:
            - status
      discriminator:
        propertyName: '@type'
        mapping:
          CalendarPeriod: '#/components/schemas/CalendarPeriod'
    CalendarPeriod_EVO:
      description: >-
        The CalendarPeriod schema represents a period of time within a calendar, defining various
        attributes such as the applicable day, timezone, hour period, and status. It is designed to
        capture information about the availability or status of a calendar period, which can be used
        in scheduling, booking, or resource allocation applications.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            day:
              $ref: '#/components/schemas/DayOfWeekType'
            timeZone:
              type: string
              pattern: '^(Z|[+-][0-1]\d:[0-5]\d)$'
              description: >-
                Indication of the timezone applicable to the calendar information in ISO 8601
                timezone: either 'Z' for UTC or an offset like +02:00 or -05:30.
            hourPeriod:
              type: array
              description: 'Start and end time range in 24-hour HH:mm format.'
              items:
                $ref: '#/components/schemas/HourPeriod_EVO'
            status:
              type: string
              description: >-
                Indication of the availability of the calendar period (e.g.: available, booked,
                etc.)
      discriminator:
        propertyName: '@type'
        mapping:
          CalendarPeriod: '#/components/schemas/CalendarPeriod_EVO'
    Characteristic:
      description: >-
        Describes a given characteristic of an object or entity through a name/value pair. This is
        an abstract base class, the actual value is in one of the strongly-typed subclasses :
        StringCharacteristic, ObjectCharacteristic, FloatCharacteristic, BooleanCharacteristic,
        NumberCharacteristic, IntegerCharacteristic, StringArrayCharacteristic,
        ObjectArrayCharacteristic, BooleanArrayCharacteristic, NumberArrayCharacteristic,
        IntegerArrayCharacteristic...
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            id:
              type: string
              description: Unique identifier of the characteristic
            name:
              type: string
              description: Name of the characteristic
            valueType:
              type: string
              description: Data type of the value of the characteristic
            characteristicRelationship:
              type: array
              description: Collection of characteristic relationships
              items:
                $ref: '#/components/schemas/CharacteristicRelationship'
          required:
            - name
      discriminator:
        propertyName: '@type'
        mapping:
          BooleanArrayCharacteristic: '#/components/schemas/BooleanArrayCharacteristic'
          BooleanCharacteristic: '#/components/schemas/BooleanCharacteristic'
          Characteristic: '#/components/schemas/Characteristic'
