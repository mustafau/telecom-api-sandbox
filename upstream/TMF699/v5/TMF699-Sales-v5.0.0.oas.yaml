    SalesLead:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            A Sales Lead is a record that captures the initial interest expressed by a prospect (an
            individual or organization) in products or services. As a preliminary artifact in the
            sales funnel, it contains unverified information that must be nurtured and qualified. A
            lead is ultimately converted into a Sales Opportunity or is disqualified.
          properties:
            description:
              type: string
              description: Concise and comprehensive description of the Sales Lead
            status:
              $ref: '#/components/schemas/SalesLeadStateType'
            statusChangeDate:
              type: string
              format: date-time
              description: Date and time of the last update of the status
            referredDate:
              type: string
              format: date-time
              description: 'Date when the prospect information was received (for example, from a trade show).'
            statusChangeReason:
              type: string
              description: Reason why the status has changed
            salesLeadType:
              type: string
              description: >-
                Indicates the nature of the salesLead, such us: newBusiness, upsell, renewal,
                cross-sell, etc.
            rating:
              type: string
              description: >-
                Identifies the potential of a salesLead for becoming a sale. Usual ratings for
                qualified leads are: hot, warm, cold.
            priority:
              $ref: '#/components/schemas/SalesPriorityType'
            revenueEstimate:
              type: array
              items:
                $ref: '#/components/schemas/RevenueEstimate'
              description: Estimation of the revenue if the salesLead turns into a sale.
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            marketingCampaign:
              $ref: '#/components/schemas/MarketingCampaignRef'
            marketSegment:
              $ref: '#/components/schemas/MarketSegmentRef'
            channel:
              $ref: '#/components/schemas/ChannelRef'
            productOffering:
              type: array
              items:
                $ref: '#/components/schemas/ProductOfferingRef'
              description: >-
                List of product offerings that the prospect has shown interest in or that have been
                proposed as part of this Sales Lead.
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
              description: >-
                List of related parties or party roles references associated with this Sales Lead,
                such as the prospect company, decision-makers, sales or marketing representatives,
                or other stakeholders involved in the sales process.
            agreement:
              type: array
              items:
                $ref: '#/components/schemas/AgreementRef'
              description: >-
                Array of references to agreements or terms discussed with the prospect as part of
                this Sales Lead.
            prospectContactMedium:
              type: array
              items:
                $ref: '#/components/schemas/ContactMedium'
              description: >-
                List of contact mediums for the prospect, including telephone, email, postal
                address, or other communication channels through which the prospect can be
                contacted.
            productSpecification:
              type: array
              items:
                $ref: '#/components/schemas/ProductSpecificationRef'
              description: >-
                List of product specifications related to the Sales Lead, defining the technical
                and/or functional characteristics of products that could be offered.
            category:
              $ref: '#/components/schemas/CategoryRef'
            salesOpportunity:
              type: array
              items:
                $ref: '#/components/schemas/SalesOpportunityRef'
              description: >-
                Reference to the sales opportunity that was created from this Sales Lead once it was
                qualified and progressed through the sales process.
            product:
              type: array
              items:
                $ref: '#/components/schemas/ProductRef'
              description: Reference to the product(s) from the inventory associated with this Sales Lead.
            note:
              type: array
              items:
                $ref: '#/components/schemas/Note'
              description: A user-generated text entry providing contextual information or commentary.
            name:
              type: string
              description: Name of the salesLead
            creationDate:
              type: string
              format: date-time
              description: Date and time of the salesLead creation
            lastUpdate:
              type: string
              format: date-time
              description: Date and time of the last update to the salesLead
          required:
            - name
      discriminator:
        propertyName: '@type'
        mapping:
          SalesLead: '#/components/schemas/SalesLead'
