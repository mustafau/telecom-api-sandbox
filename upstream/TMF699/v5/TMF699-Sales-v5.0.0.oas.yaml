                A collection of line items that constitutes the detailed scope of the sales
                opportunity, with each item specifying a target product or service, its quantity,
                its estimated value and all specific information.
              type: array
              items:
                $ref: '#/components/schemas/SalesOpportunityItem'
            name:
              type: string
              description: Name of the SalesOpportunity
          required:
            - name
      discriminator:
        propertyName: '@type'
        mapping:
          SalesOpportunity: '#/components/schemas/SalesOpportunity_FVO'
    SalesOpportunity_MVO:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            A Sales Opportunity represents a qualified potential for a sale, created when a prospect
            demonstrates a concrete and actionable interest. As a formal entry in the sales
            pipeline, it is tracked with an estimated value, a timeline, and a probability of
            success. Its lifecycle is managed through defined sales stages until it is won or lost.
          properties:
            description:
              type: string
              description: Concise and comprehensive description of the SalesOpportunity
            salesLead:
              type: array
              items:
                $ref: '#/components/schemas/SalesLeadRef'
              description: References to the SalesLead resources that gave rise to this SalesOpportunity.
            rating:
              type: string
              description: >-
                Identifies the potential of the opportunity for becoming a sale, with common values
                being hot, warm, or cold. This overall rating is typically aggregated from its
                items, often reflecting the highest potential among them.
            referredDate:
              type: string
              format: date-time
              description: 'Date when the prospect information was received (for example, from a trade show).'
            status:
              $ref: '#/components/schemas/SalesOpportunityStateType'
            statusChangeDate:
              type: string
              format: date-time
              description: Date and time of the last update of status.
            statusChangeReason:
              type: string
              description: Reason why the status has changed
            salesOpportunityType:
              type: string
              description: >-
                Indicates the nature of the SalesOpportunity, such us: newBusiness, upsell, renewal,
                cross-sell, etc.
            revenueEstimate:
              type: array
              items:
                $ref: '#/components/schemas/RevenueEstimate_MVO'
              description: >-
                The aggregated and consolidated total value of the revenue estimate for the sales
                opportunity, which can be derived from the sum of its items or from a specific
                estimation at the opportunity level.
            priority:
              $ref: '#/components/schemas/SalesPriorityType'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            category:
              $ref: '#/components/schemas/CategoryRef'
            channel:
              $ref: '#/components/schemas/ChannelRef'
            marketSegment:
              $ref: '#/components/schemas/MarketSegmentRef'
            marketingCampaign:
              $ref: '#/components/schemas/MarketingCampaignRef'
            note:
              type: array
              description: A user-generated text entry providing contextual information or commentary.
              items:
                $ref: '#/components/schemas/Note'
            agreement:
              description: >-
                A formal agreement that documents the commercial terms and commitments negotiated
                and agreed upon during the lifecycle of a sales opportunity.
              type: array
              items:
                $ref: '#/components/schemas/AgreementRef'
            relatedParty:
              description: >-
                A reference to an involved party, which is identified either by its core entity or
                by the specific role it plays in the context of the interaction.
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef_MVO'
            quote:
              description: >-
                A formal offer, generated during the sales opportunity lifecycle, that details the
                proposed products, services, and pricing.
              type: array
              items:
                $ref: '#/components/schemas/QuoteRef'
            salesProject:
              type: array
              description: >-
                An array of references to sales projects or initiatives to which this opportunity
                belongs.
              items:
                $ref: '#/components/schemas/SalesProjectRef'
            salesOpportunityItem:
              description: >-
                A collection of line items that constitutes the detailed scope of the sales
                opportunity, with each item specifying a target product or service, its quantity,
                its estimated value and all specific information.
              type: array
              items:
                $ref: '#/components/schemas/SalesOpportunityItem_MVO'
            name:
              type: string
              description: Name of the SalesOpportunity
      discriminator:
        propertyName: '@type'
        mapping:
          SalesOpportunity: '#/components/schemas/SalesOpportunity_MVO'
