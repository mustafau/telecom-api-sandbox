openapi: 3.0.1
info:
  title: Sales Management
  description: >-
    **TMF API Reference : TMF699 - Sales Management**


    **April 2026**


    This API provides interfaces for Sales Lead and Sales Opportunity to support the sales
    activities to build relationship with the prospect customer who could be a person or
    organization that has an interest in the goods and/or services and possibly become the actual
    customers with one or more subscriptions.


    **Sales Lead resource** The Lead corresponds to the nominal result of an interaction involving a
    prospective customer towards one of offers or services. It is the first stage (S) of the SPANCO
    process. A prospect could have expressed a commercial interest, or a commercial interest has
    been detected from his behavior analysis. The Lead Management function enables to collect,
    evaluate and attribute the leads to the appropriate sales representatives. The lead is an
    interest concerning an offer family or a product line, or expressed literally during an
    interaction, possibly further to a marketing campaign, and it must be handled and specified to
    become an opportunity or an order.


    **Sales Opportunity resource** In a nominal way, once the interest towards offers or services is
    confirmed and the prospective customer clearly identified, then an Opportunity is created. Some
    sales activities are made by sales team on this opportunity (calls, emails, meetings, quotes, …)
    to try to turn it into a sale.
