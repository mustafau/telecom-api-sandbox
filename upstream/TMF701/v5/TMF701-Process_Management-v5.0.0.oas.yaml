openapi: 3.0.1
info:
  title: Process Management
  description: >-
    *The TMF701 Process Management API* allows management of business process definition and
    execution. It manages Process, ProcessSpecification, Task and TaskSpecification resources:

    - A ProcessSpecification is a business process specification described in a BPMN engine or hard
    coded. It describes relationship with other entity specification but also party involved in this
    specification design. A ProcessSpecification will define an orchestration of TaskSpecification.
    A TaskSpecification could be re-used by several ProcessSpecification.

    - A Process represents an instance of a pre-designed ProcessSpecification. It defines a start
    point, an orchestration of task(that could be dynamically instantiated) and end point(s). A Task
    is unique to one given process and cannot exist independently from it. Entities involved in the
    process completion could be related to the process.

    - A TaskSpecification is a business process task specification, in other words, a “work”
    description to be done within a ProcessSpecification.

    - A Task is an instantiation of a TaskSpecification. It could be completed automatically (send
    an email, execute a business rule, wait for an event triggered by an external system) or
    requiring manual action (a form to be completed).

