    Task:
      description: >-
        A task is an atomic or composite activity that represents a unit of work, that could be
        stand alone or belonging to a process, manual or automated, performed by a person, system,
        or external entity.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            description:
              type: string
              description: >-
                Indicated the description of the task: atomic or composite, stand alone or belonging
                to a process, manual or automated, and any relevant information.
            taskCharacteristic:
              type: array
              items:
                $ref: '#/components/schemas/FlowCharacteristic'
              description: A list of characteristic(s) associated to this task
            startDate:
              type: string
              format: date-time
              description: Effective start date for this process
            completionDate:
              type: string
              format: date-time
              description: Effective completion date for this process
            isMandatory:
              type: boolean
              description: >-
                Indicates whether the task must be completed before the process can continue, as
                defined by the process logic or engine.
            taskRelationship:
              type: array
              items:
                $ref: '#/components/schemas/TaskRelationship'
              description: >-
                A list of tasks related to this task, relationships between tasks could be:
                triggers, isParallelWith, dependsOn, ...
            relatedProcess:
              type: array
              description: >-
                A relationship to an external process other than the process that contains this
                task, the relationship could be: triggers, isUpdatedBy, synchronizedWith, monitors,
                dependsOn, associatedTo, ...
              items:
                $ref: '#/components/schemas/RelatedProcess'
            parentProcess:
              $ref: '#/components/schemas/ProcessRef'
            taskSpecification:
              $ref: '#/components/schemas/TaskSpecificationRef'
            name:
              type: string
              description: The name of the task
            channel:
              $ref: '#/components/schemas/ChannelRef'
            taskType:
              type: string
              description: >-
                The type of the task, the BPMN standard distinguish different types of tasks like 
                sendTask, receiveTask, userTask, manualTask, scriptTask, businessRuleTask.
            priority:
              type: integer
              description: >-
                Indicates task urgency level for execution order and resource allocation; may be
                defined and interpreted by internal process logic or orchestration engines.
            relatedEntity:
              type: array
              items:
                $ref: '#/components/schemas/RelatedEntity'
              description: >-
                A list of related entity(ies) to this task, for example entity(ies) that have been
                created or updated by this task (a shoppingCart, a productOrder, an individual)
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
              description: A list of related party(ies) to this task
            state:
              $ref: '#/components/schemas/FlowStateType'
      discriminator:
        propertyName: '@type'
        mapping:
          Task: '#/components/schemas/Task'
