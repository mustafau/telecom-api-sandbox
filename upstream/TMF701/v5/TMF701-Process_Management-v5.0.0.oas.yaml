    ProcessSpecification:
      description: >-
        ProcessSpecification is a class that allow to describe a process design. A process instance
        will use a ProcessSpecification as reference.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            description:
              type: string
              description: Description of the process specification
            lastUpdate:
              type: string
              format: date-time
              description: Date and time of the last update of the process specification
            processSpecificationPolicy:
              type: array
              items:
                $ref: '#/components/schemas/PolicyRef'
              description: >-
                A list of policies related to this process specification to dynamically reference
                and comply with predefined policies, for example for approval process, onboarding
                process or eligibility check tasks.
            lifecycleStatus:
              type: string
              description: >-
                Used to indicate the current lifecycle status of this process specification, for
                example: draft, underReview, inProduction, released, deprecated
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            version:
              type: string
              description: the process specification version
            attachment:
              type: array
              description: >-
                Attachments that are of relevance to this process specification, such as picture,
                document, media. This could be for example a how-to or a faq to explain this process
                specification
              items:
                $ref: '#/components/schemas/AttachmentRefOrValue'
            taskSpecification:
              type: array
              description: >-
                A list of task specifications that define the tasks that can potentially be
                instantiated within a process that is instantiated from this process specification.
              items:
                $ref: '#/components/schemas/TaskSpecificationRef'
            channel:
              type: array
              items:
                $ref: '#/components/schemas/ChannelRef'
              description: >-
                A list of channels where Processes instantiated from this ProcessSpecification could
                be executed
            processSpecificationCharacteristic:
              type: array
              description: List of characteristics that the process specification can take
              items:
                $ref: '#/components/schemas/FlowCharacteristicSpecification'
            relatedParty:
              type: array
              description: Parties who manage or otherwise have an interest in this process Specification
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            processSpecificationRelationship:
              type: array
              description: >-
                A list of design-time policy links from the current ProcessSpecification to other
                ProcessSpecifications, declaring which instance-level relationships are permitted or
                expected via relationshipType (e.g., Trigger/BeTriggeredBy,
                DelegateTo/BeDelegatedBy, DependOn/RequiredBy).
              items:
